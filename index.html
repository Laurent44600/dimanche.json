<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paroisse Saint-François en Saint-Nazaire</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dimanche">
<meta name="theme-color" content="#0f4c81">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F7F3EC;
    --paper-raised: #FFFFFF;
    --ink: #2A2A28;
    --ink-soft: #6b6560;
    --navy: #0f4c81;
    --navy-dark: #0b3760;
    --gold: #e0a13c;
    --line: #E4DDD0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom, 0px) + 40px);
    min-height: 100%;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 36px 22px 20px;
    text-align: center;
  }

  .logo {
    width: 148px;
    height: 148px;
    margin: 0 auto 18px;
    display: block;
  }

  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 23px;
    line-height: 1.3;
    color: var(--navy-dark);
    margin: 0 0 34px;
  }

  .jour-label {
    font-family: 'Source Serif 4', Georgia, serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink-soft);
    text-align: left;
    margin: 26px 4px 10px;
  }

  .jour-label:first-of-type { margin-top: 0; }

  .celebration-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 16px;
    margin-bottom: 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    color: var(--navy-dark);
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(42, 42, 40, 0.06);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .celebration-btn:active {
    transform: scale(0.98);
    box-shadow: none;
  }

  .celebration-btn .heure {
    color: var(--gold);
    font-weight: 700;
  }

  .empty-state {
    color: var(--ink-soft);
    font-size: 15px;
    padding: 30px 10px;
  }

  /* Pop-up mode silencieux */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 76, 129, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    animation: fadeIn 0.2s ease;
  }

  .overlay.hidden { display: none; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .popup {
    background: var(--paper-raised);
    border-radius: 18px;
    max-width: 340px;
    width: 100%;
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  }

  .popup .icon {
    font-size: 34px;
    margin-bottom: 12px;
  }

  .popup p {
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 20px;
  }

  .popup button {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="icon">🔕</div>
    <p>Merci de passer votre appareil en mode silencieux avant le début de la célébration.</p>
    <button onclick="document.getElementById('overlay').classList.add('hidden')">J'ai compris</button>
  </div>
</div>

<main>
  <img class="logo" src="assets/logo.png" alt="Paroisse Saint-François en Saint-Nazaire">
  <h1 id="titre">Chargement…</h1>
  <div id="content"><div class="empty-state">Chargement des horaires…</div></div>
</main>

<script>
  const CONFIG_URL = "https://raw.githubusercontent.com/Laurent44600/dimanche.json/refs/heads/main/config.json";

  const NOMS_EGLISE = {
    "ste-anne": "Église Sainte-Anne",
    "st-gohard": "Église Saint-Gohard",
    "st-nazaire": "Église Saint-Nazaire",
  };

  function bouton(cel) {
    const nom = NOMS_EGLISE[cel.clocher] || cel.nom || "";
    return `<a class="celebration-btn" href="eglise.html?c=${encodeURIComponent(cel.clocher)}">
      <span class="heure">${cel.horaire}</span><span>${nom}</span>
    </a>`;
  }

  async function load() {
    const contentEl = document.getElementById("content");
    try {
      const res = await fetch(CONFIG_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Réponse réseau invalide");
      const config = await res.json();

      document.getElementById("titre").textContent =
        config.titre || (config.we_type === "particuliere" ? "Célébration particulière" : "Dimanche ordinaire");

      const samedi = (config.celebrations || []).filter(c => c.jour === "samedi");
      const dimanche = (config.celebrations || []).filter(c => c.jour === "dimanche");

      let html = "";
      if (samedi.length) {
        html += `<p class="jour-label">Samedi</p>`;
        samedi.forEach(c => html += bouton(c));
      }
      if (dimanche.length) {
        html += `<p class="jour-label">Dimanche</p>`;
        dimanche.forEach(c => html += bouton(c));
      }
      if (!samedi.length && !dimanche.length) {
        html = `<div class="empty-state">Aucune célébration annoncée pour le moment.</div>`;
      }

      contentEl.innerHTML = html;
    } catch (e) {
      contentEl.innerHTML = `<div class="empty-state">Impossible de charger les horaires.<br>Vérifie ta connexion et réessaie.</div>`;
      document.getElementById("titre").textContent = "Paroisse Saint-François";
    }
  }

  load();
</script>

</body>
</html>
