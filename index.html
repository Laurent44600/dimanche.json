<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dimanche</title>

<!-- Installation sur écran d'accueil (iPhone / Android) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dimanche">
<meta name="theme-color" content="#2c3e6e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F7F3EC;
    --paper-raised: #FFFFFF;
    --ink: #2A2A28;
    --ink-soft: #6b6560;
    --navy: #2c3e6e;
    --navy-soft: #4a5a8a;
    --gold: #B08D57;
    --line: #E4DDD0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    padding-bottom: env(safe-area-inset-bottom, 24px);
  }

  header {
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 24px 22px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .kicker {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--gold);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 4px;
    color: var(--navy);
  }

  .date {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .section-title {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
    margin: 28px 4px 10px;
  }

  .section-title:first-child { margin-top: 4px; }

  ul.items {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--paper-raised);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(42, 42, 40, 0.06);
  }

  .item + .item { border-top: 1px solid var(--line); }

  .item-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 16px;
    background: none;
    border: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .item-header .titre {
    font-size: 16px;
    font-weight: 500;
  }

  .item-header .ref {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .chev {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--gold);
    transition: transform 0.2s ease;
  }

  .item.open .chev { transform: rotate(90deg); }

  .item-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .item.open .item-body {
    max-height: 4000px;
  }

  .item-body-inner {
    padding: 0 16px 20px;
    font-size: 16px;
    line-height: 1.65;
    white-space: pre-wrap;
    color: var(--ink);
  }

  .item-body-inner a {
    color: var(--navy-soft);
    text-decoration: underline;
    text-decoration-color: var(--gold);
    text-underline-offset: 2px;
  }

  .empty, .error {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 15px;
  }

  .error { color: #a44; }

  .refresh-hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 32px;
  }

  .refresh-hint button {
    border: none;
    background: none;
    color: var(--navy-soft);
    text-decoration: underline;
    font: inherit;
    cursor: pointer;
    padding: 0;
  }
</style>
</head>
<body>

<header>
  <p class="kicker">Église Saint-Nazaire</p>
  <h1 id="titre">Chargement…</h1>
  <p class="date" id="date"></p>
</header>

<main id="main">
  <div class="empty" id="loading">Chargement du contenu…</div>
</main>

<script>
  // ⚠️ Doit pointer vers le même fichier JSON que l'application Android.
  const CONTENT_URL = "https://raw.githubusercontent.com/Laurent44600/dimanche.json/refs/heads/main/dimanche.json";

  function linkify(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    return escaped.replace(/(https?:\/\/[^\s]+)/g, (url) => {
      const clean = url.replace(/[.,)]+$/, "");
      return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>`;
    });
  }

  function renderSection(title, items) {
    if (!items || items.length === 0) return "";
    const rows = items.map((item, i) => `
      <li class="item">
        <button class="item-header" onclick="this.parentElement.classList.toggle('open')">
          <span>
            <div class="titre">${item.titre}</div>
            ${item.reference ? `<div class="ref">${item.reference}</div>` : ""}
          </span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <div class="item-body">
          <div class="item-body-inner">${linkify(item.texte || "")}</div>
        </div>
      </li>`).join("");
    return `<p class="section-title">${title}</p><ul class="items">${rows}</ul>`;
  }

  async function load() {
    const main = document.getElementById("main");
    try {
      const res = await fetch(CONTENT_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Réponse réseau invalide");
      const data = await res.json();

      document.getElementById("titre").textContent = data.titre_dimanche || "Dimanche";
      document.getElementById("date").textContent = data.date || "";

      let html = "";
      html += renderSection("Chants", data.chants);
      html += renderSection("Lectures", data.lectures);

      if (!html) {
        html = `<div class="empty">Aucun contenu pour le moment.</div>`;
      }

      html += `<p class="refresh-hint"><button onclick="location.reload()">Actualiser</button></p>`;

      main.innerHTML = html;
    } catch (e) {
      main.innerHTML = `<div class="error">Impossible de charger le contenu pour le moment.<br>Vérifie ta connexion internet et réessaie.</div>
        <p class="refresh-hint"><button onclick="location.reload()">Réessayer</button></p>`;
    }
  }

  load();
</script>

</body>
</html>
