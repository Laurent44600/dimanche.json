<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chants — Dimanche</title>

<meta name="theme-color" content="#0f4c81">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F7F3EC;
    --paper-raised: #FFFFFF;
    --ink: #2A2A28;
    --ink-soft: #6b6560;
    --navy: #0f4c81;
    --navy-dark: #0b3760;
    --gold: #e0a13c;
    --line: #E4DDD0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); }

  header {
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .back {
    text-decoration: none;
    color: var(--navy);
    font-size: 22px;
    line-height: 1;
    padding: 4px;
  }

  header .titres { flex: 1; min-width: 0; }

  header .eglise {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--navy-dark);
    margin: 0;
  }

  header .sous {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  ul.items {
    list-style: none;
    margin: 0 0 24px;
    padding: 0;
    background: var(--paper-raised);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(42, 42, 40, 0.06);
  }

  .item + .item { border-top: 1px solid var(--line); }

  .item-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px;
    background: none;
    border: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  .item-header .titre { font-size: 16px; font-weight: 500; }

  .chev {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--gold);
    transition: transform 0.2s ease;
  }

  .item.open .chev { transform: rotate(90deg); }

  .item-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .item.open .item-body { max-height: 4000px; }

  .item-body-inner {
    padding: 0 16px 20px;
    font-size: 16px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .aelf-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 18px;
    background: var(--navy);
    color: white;
    border-radius: 14px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
  }

  .empty, .error {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 15px;
  }
  .error { color: #a44; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html" aria-label="Retour">←</a>
  <div class="titres">
    <p class="eglise" id="eglise">Chargement…</p>
    <p class="sous" id="sous"></p>
  </div>
</header>

<main id="main">
  <div class="empty">Chargement du contenu…</div>
</main>

<script>
  const REPO_BASE = "https://raw.githubusercontent.com/Laurent44600/dimanche.json/refs/heads/main/";

  const params = new URLSearchParams(location.search);
  const clocher = params.get("c") || "";

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderChants(chants) {
    if (!chants || chants.length === 0) return "";
    const rows = chants.map(c => `
      <li class="item">
        <button class="item-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="titre">${escapeHtml(c.titre)}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <div class="item-body">
          <div class="item-body-inner">${escapeHtml(c.texte || "")}</div>
        </div>
      </li>`).join("");
    return `<ul class="items">${rows}</ul>`;
  }

  async function load() {
    const main = document.getElementById("main");
    if (!clocher) {
      main.innerHTML = `<div class="error">Église non spécifiée.</div>`;
      return;
    }
    try {
      const res = await fetch(REPO_BASE + clocher + ".json", { cache: "no-store" });
      if (!res.ok) throw new Error("Réponse réseau invalide");
      const data = await res.json();

      document.getElementById("eglise").textContent = data.clocher || "Église";
      document.getElementById("sous").textContent = [data.horaire, data.date].filter(Boolean).join(" — ");
      document.title = "Chants — " + (data.clocher || "");

      let html = renderChants(data.chants);
      if (!html) html = `<div class="empty">Aucun chant pour le moment.</div>`;

      if (data.aelf_url) {
        html += `<a class="aelf-btn" href="${data.aelf_url}" target="_blank" rel="noopener">📖 Lectures du jour</a>`;
      }

      main.innerHTML = html;
    } catch (e) {
      main.innerHTML = `<div class="error">Impossible de charger le contenu.<br>Vérifie ta connexion et réessaie.</div>`;
    }
  }

  load();
</script>

</body>
</html>
